name: Analyzer false positive
description: Report a safe code pattern flagged by agentic-go.
title: "false positive: "
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: concurrency-01 or errors-04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agentic-go version or commit
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code example
      description: Prefer a reduced public example. Do not paste proprietary source.
      render: go
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Why this pattern is safe
      description: Include lifecycle, ownership, call-site, or type information the analyzer missed.
    validations:
      required: true
