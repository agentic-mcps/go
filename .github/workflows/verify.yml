name: Verify

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "assets/**"
      - "site/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "assets/**"
      - "site/**"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x", "1.27.x"]
        os: [ubuntu-latest]
        include:
          - go: "1.27.x"
            os: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build -mod=readonly ./...
      - name: Race tests
        run: go test -mod=readonly -race ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Test installer
        run: bash scripts/install.test.sh

  gopls-contract:
    name: gopls contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Cache gopls sidecar
        id: cache-gopls
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ${{ runner.temp }}/agentic-go-gopls
          key: gopls-v0.21.0-${{ matrix.os }}-${{ runner.arch }}
      - name: Build pinned sidecar
        if: steps.cache-gopls.outputs.cache-hit != 'true'
        run: |
          go mod download golang.org/x/tools/gopls@v0.21.0
          gopls_source="$(go env GOMODCACHE)/golang.org/x/tools/gopls@v0.21.0"
          (cd "$gopls_source" && GOTELEMETRY=off go build -mod=readonly -trimpath -ldflags='-X main.version=v0.21.0' -o "$RUNNER_TEMP/agentic-go-gopls" .)
      - name: Run LSP contract
        env:
          AGENTIC_GO_GOPLS: ${{ runner.temp }}/agentic-go-gopls
          GOTELEMETRY: "off"
        run: go test ./internal/gopls ./internal/intelligence ./internal/mcptest -count=1

  quality:
    name: Quality & Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
      - name: Build release bundles
        run: go run ./internal/cmd/releasepack --version 1.0.0-test --output /tmp/agentic-go-release
      - name: Test Action adapters
        run: node --test scripts/action-*.test.mjs
