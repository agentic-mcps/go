<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">agentic-go change loop</title>
  <desc id="desc">A five-step loop from workspace brief to begin change, edit, checkpoint, and verify.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#00add8"/>
      <stop offset="1" stop-color="#00758d"/>
    </linearGradient>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="4">
      <path d="M0 0 8 4 0 8Z" fill="#00758d"/>
    </marker>
  </defs>
  <rect width="1200" height="280" rx="32" fill="#f6f8fa"/>
  <text x="48" y="48" fill="#57606a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" letter-spacing="1.6">A SMALL LOOP FOR A LONG CHANGE</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(36 84)">
      <rect width="190" height="130" rx="30" fill="#111318"/>
      <circle cx="28" cy="30" r="14" fill="url(#accent)"/>
      <text x="28" y="35" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">01</text>
      <text x="24" y="75" fill="#ffffff" font-size="20" font-weight="700">Brief</text>
      <text x="24" y="101" fill="#b9c0c8" font-size="14">map the workspace</text>
    </g>
    <path d="M236 149h30" stroke="#00758d" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(276 84)">
      <rect width="190" height="130" rx="30" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <circle cx="28" cy="30" r="14" fill="#dff7fc"/>
      <text x="28" y="35" text-anchor="middle" fill="#00758d" font-size="13" font-weight="700">02</text>
      <text x="24" y="75" fill="#111318" font-size="20" font-weight="700">Begin</text>
      <text x="24" y="101" fill="#57606a" font-size="14">set the contract</text>
    </g>
    <path d="M476 149h30" stroke="#00758d" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(516 84)">
      <rect width="190" height="130" rx="30" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <circle cx="28" cy="30" r="14" fill="#dff7fc"/>
      <text x="28" y="35" text-anchor="middle" fill="#00758d" font-size="13" font-weight="700">03</text>
      <text x="24" y="75" fill="#111318" font-size="20" font-weight="700">Edit</text>
      <text x="24" y="101" fill="#57606a" font-size="14">change the code</text>
    </g>
    <path d="M716 149h30" stroke="#00758d" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(756 84)">
      <rect width="190" height="130" rx="30" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <circle cx="28" cy="30" r="14" fill="#dff7fc"/>
      <text x="28" y="35" text-anchor="middle" fill="#00758d" font-size="13" font-weight="700">04</text>
      <text x="24" y="75" fill="#111318" font-size="20" font-weight="700">Checkpoint</text>
      <text x="24" y="101" fill="#57606a" font-size="14">catch drift early</text>
    </g>
    <path d="M956 149h30" stroke="#00758d" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(996 84)">
      <rect width="168" height="130" rx="30" fill="url(#accent)"/>
      <circle cx="28" cy="30" r="14" fill="#ffffff"/>
      <text x="28" y="35" text-anchor="middle" fill="#00758d" font-size="13" font-weight="700">05</text>
      <text x="24" y="75" fill="#ffffff" font-size="20" font-weight="700">Verify</text>
      <text x="24" y="101" fill="#e6fbff" font-size="14">show evidence</text>
    </g>
  </g>
</svg>
