version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - revive
    - staticcheck
    - unused
  settings:
    govet:
      enable:
        - shadow
        - fieldalignment
    revive:
      enable-default-rules: true
      rules:
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofumpt
